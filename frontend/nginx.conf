worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  proxy_headers_hash_max_size 1024;
  proxy_headers_hash_bucket_size 128;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;
  # Permite un flujo administrativo completo (validar, ejecutar y consultar el
  # trabajo) sin desactivar la protección básica del proxy.
  limit_req_zone $binary_remote_addr zone=heavy:10m rate=120r/m;
  limit_req_status 429;
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ~* ^/assets/.+\.[a-f0-9]+\.(js|css|woff2?|png|svg)$ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location ~ ^/api/v1/auth/browser/(login|refresh)$ { limit_req zone=auth burst=15 nodelay; proxy_pass http://api:8000; include /etc/nginx/proxy_params; proxy_set_header X-Forwarded-Proto $scheme; proxy_no_cache 1; }
    location ~ ^/api/v1/(reports|alerts/evaluate|data-imports|geometry-imports) { limit_req zone=heavy burst=30 nodelay; proxy_pass http://api:8000; include /etc/nginx/proxy_params; proxy_read_timeout 300s; proxy_request_buffering on; proxy_no_cache 1; }
    location /api/ { proxy_pass http://api:8000; include /etc/nginx/proxy_params; proxy_set_header X-Request-ID $request_id; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 120s; proxy_no_cache 1; add_header Cache-Control "no-store" always; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-store"; }
  }
}
