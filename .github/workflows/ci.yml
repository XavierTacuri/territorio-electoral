name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: pytest -q
        working-directory: backend
      - run: python -m compileall -q app
        working-directory: backend
      - run: docker build -t territorio-api:ci backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run api:generate && git diff --exit-code -- src/api/generated
        working-directory: frontend
      - run: npm run lint && npm run format:check && npm run typecheck && npm run test && npm run build
        working-directory: frontend
      - run: docker build -t territorio-frontend:ci frontend
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp backend/.env.production.example backend/.env.production
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.prod.yml config --quiet
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose --profile frontend up --build -d
      - run: docker compose exec -T api alembic upgrade head
      - run: E2E_EXTERNAL_SERVER=1 E2E_BASE_URL=http://localhost:5173 npm run e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-failures, path: "frontend/test-results" }
      - if: always()
        run: docker compose --profile frontend down -v
