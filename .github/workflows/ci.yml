name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      POSTGRES_DB: territorio_ci
      POSTGRES_USER: territorio_ci
      POSTGRES_PASSWORD: territorio_ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      SECRET_KEY: ci-secret-key-with-at-least-32-characters
      BROWSER_REFRESH_TOKEN_HMAC_SECRET: ci-refresh-secret-with-at-least-32-characters
      SURVEY_SUBMISSION_HMAC_SECRET: ci-survey-secret-with-at-least-32-characters
      REPORT_OUTPUT_DIR: /tmp/territorio-electoral-reports
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: territorio_ci
          POSTGRES_USER: territorio_ci
          POSTGRES_PASSWORD: territorio_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U territorio_ci -d territorio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Create report output directory
        run: mkdir -p "$REPORT_OUTPUT_DIR"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply migrations
        run: python -m alembic upgrade head
      - name: Check migrations
        run: python -m alembic check
      - name: Run backend tests
        run: python -m pytest -q
      - name: Compile backend
        run: python -m compileall -q app
      - name: Build backend image
        run: docker build -t territorio-api:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify generated API client
        run: npm run api:generate && git diff --exit-code -- src/api/generated
      - name: Lint frontend
        run: npm run lint
      - name: Check frontend formatting
        run: npm run format:check
      - name: Type-check frontend
        run: npm run typecheck
      - name: Run frontend tests
        run: npm run test
      - name: Build frontend
        run: npm run build
      - name: Build frontend image
        run: docker build -t territorio-frontend:ci .

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create safe CI environment files
        run: |
          cp backend/.env.example backend/.env
          cp backend/.env.example backend/.env.production
      - name: Validate development Compose
        run: docker compose config --quiet
      - name: Validate production Compose
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Validate E2E Compose
        env:
          E2E_DB_PASSWORD: ci-e2e-db-password
          E2E_SECRET_KEY: ci-e2e-secret-key-with-at-least-32-characters
          E2E_REFRESH_SECRET: ci-e2e-refresh-secret-with-at-least-32-characters
          E2E_SURVEY_SECRET: ci-e2e-survey-secret-with-at-least-32-characters
          E2E_USER_PASSWORD: CiE2ePassword123
        run: docker compose -f docker-compose.e2e.yml config --quiet

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose]
    env:
      E2E_DB_PASSWORD: ci-e2e-db-password
      E2E_SECRET_KEY: ci-e2e-secret-key-with-at-least-32-characters
      E2E_REFRESH_SECRET: ci-e2e-refresh-secret-with-at-least-32-characters
      E2E_SURVEY_SECRET: ci-e2e-survey-secret-with-at-least-32-characters
      E2E_USER_PASSWORD: CiE2ePassword123
      E2E_EXTERNAL_SERVER: "1"
      E2E_BASE_URL: http://localhost:15173
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Playwright dependencies
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Start isolated E2E stack
        run: docker compose -p territorio-e2e -f docker-compose.e2e.yml up --build -d
      - name: Apply E2E migrations
        run: docker compose -p territorio-e2e -f docker-compose.e2e.yml exec -T api alembic upgrade head
      - name: Seed E2E data
        run: docker compose -p territorio-e2e -f docker-compose.e2e.yml exec -T api python -m app.scripts.seed_e2e
      - name: Run portable E2E smoke tests
        working-directory: frontend
        run: npx playwright test tests/e2e/smoke.spec.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: frontend/test-results
      - if: always()
        run: docker compose -p territorio-e2e -f docker-compose.e2e.yml down -v
