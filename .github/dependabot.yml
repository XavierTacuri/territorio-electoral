version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    versioning-strategy: increase-if-necessary
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    versioning-strategy: increase-if-necessary
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
